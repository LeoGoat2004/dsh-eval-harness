name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsh-eval-harness
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.19'
      - name: Install dashboard dependencies
        run: npm --prefix dashboard ci
      - name: Install workspace dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build (plugin + dashboard template)
        run: npm run build
      - name: Unit and contract tests
        run: npm test
      - name: Hermetic pipeline self-check
        run: npm run test:pipeline
      - name: Package smoke (tarball install, dashboard generation)
        run: npm run test:pack

  docker-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsh-eval-harness
    env:
      DSH_EVAL_DOCKER_TESTS: '1'
      DSH_EVAL_PIP_INDEX: 'https://pypi.org/simple'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.19'
      - name: Install workspace dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Container E2E (agent exit code, timeout, guard, grader isolation)
        run: npm run test:pipeline

