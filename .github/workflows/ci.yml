name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsh-eval-harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19'
      - name: Install dashboard dependencies
        run: npm --prefix dashboard ci
      - name: Install workspace dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build (plugin + dashboard template)
        run: npm run build
      - name: Unit and contract tests
        run: npm test
      - name: Hermetic pipeline self-check
        run: npm run test:pipeline
      - name: Package smoke (tarball install, dashboard generation)
        run: npm run test:pack
